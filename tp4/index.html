<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="bg-light">

  <div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
      <h1 class="h3">stock management</h1>
    </header>
    <div id="error-container"></div>
    <div id="indicators-container" class="row mb-4"></div>
    <div class="card mb-4 shadow-sm">
      <div class="card-body row g-3">
        <div class="col-md-4">
          <label for="search-input" class="form-label">Search by customer</label>
          <input type="text" id="search-input" class="form-control" placeholder="Customer name...">
        </div>
        <div class="col-md-4">
          <label for="status-filter" class="form-label">Filter by status</label>
          <select id="status-filter" class="form-select">
            <option value="All">All statuses</option>
            <option value="Delivered">Delivered</option>
            <option value="Pending">Pending</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="category-filter" class="form-label">Filter by product category</label>
          <select id="category-filter" class="form-select">
            <option value="All">All categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Furniture">Furniture</option>
            <option value="Accessories">Accessories</option>
          </select>
        </div>
      </div>
    </div>
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0">Orders List</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Status</th>
                <th>Total</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="orders-tbody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderModalLabel">Order Details #<span id="modal-order-id"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p><strong>Customer:</strong> <span id="modal-customer-name"></span> (<span id="modal-customer-city"></span>)</p>
          <p><strong>Date:</strong> <span id="modal-order-date"></span></p>
          <p><strong>Status:</strong> <span id="modal-order-status"></span></p>
          <hr>
          <h6>Ordered Products:</h6>
          <ul id="modal-items-list" class="list-group mb-3">
          </ul>
          <div class="d-flex justify-content-between align-items-center">
            <strong>Total Amount:</strong>
            <span id="modal-order-total" class="fs-5 text-success fw-bold"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</html>
